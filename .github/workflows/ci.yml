# Purpose: Defines canonical CI dependency installation, workspace checks, generated API-contract verification and frontend artifact upload; sync its discovery copy with sync-workflows.mjs.
name: CI
on:
  pull_request:
  push:
    branches: [main, develop, 'feature/employee-access-*']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/api/requirements*.txt
      - run: pnpm install --frozen-lockfile
      - run: pip install -r services/api/requirements.txt -r services/api/requirements-dev.txt
      - run: pnpm verify
      - name: Verify generated API declarations
        run: |
          python infra/tools/export_openapi.py
          pnpm api:generate
          git diff --exit-code services/api/openapi.json packages/api-client/src/generated/schema.d.ts
      - uses: actions/upload-artifact@v4
        with:
          name: tripraft-frontends
          path: |
            apps/web/dist
            apps/admin/dist

  employee-postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: employee_test
          POSTGRES_PASSWORD: disposable-test-only
          POSTGRES_DB: tripraft_employee_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U employee_test -d tripraft_employee_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r services/api/requirements.txt -r services/api/requirements-dev.txt
      - name: Check additive employee migration on disposable PostgreSQL
        working-directory: services/api
        env:
          EMPLOYEE_TEST_POSTGRES_URL: postgresql://employee_test:disposable-test-only@127.0.0.1:5432/tripraft_employee_test
        run: python -m pytest tests/test_employee_postgresql.py tests/test_database_release_postgresql.py -q
